<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Gabungkan beberapa file PDF menjadi satu PDF dengan urutan halaman yang dapat diatur.">
<title>Merge PDF — Indonesia Utility Tools</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.merge-box{background:#fff;border:1px solid #dbe3ea;border-radius:16px;padding:22px;box-shadow:0 7px 18px rgba(15,39,71,.045);margin-top:18px}
.merge-list{margin-top:14px;display:grid;gap:8px}
.merge-item{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #dbe3ea;border-radius:10px;background:#f8fafc}
.merge-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.merge-actions{display:flex;gap:5px}
.merge-actions button{border:1px solid #ccd6e1;background:#fff;border-radius:7px;padding:6px 9px;cursor:pointer}
.merge-actions button:disabled{opacity:.45;cursor:not-allowed}
.iu-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.iu-btn{border:0;border-radius:9px;padding:11px 16px;background:#d8b45a;color:#16263a;font-weight:800;cursor:pointer}
.iu-btn.alt{background:#e9eef3}
.iu-btn:disabled{opacity:.5;cursor:not-allowed}
.iu-result{margin-top:15px;padding:15px;background:#f4f7fa;border-radius:10px;white-space:pre-wrap;overflow:auto}
</style></head>
<body>
<header class="site-header"><div class="container nav">
<a class="brand" href="../index.html"><span class="brand-mark">IU</span><span>INDONESIA<br><b>UTILITY TOOLS</b></span></a>
<nav><a href="../index.html#categories">Kategori</a><a href="../index.html#popular">Populer</a></nav>
</div></header>
<main class="tool-page"><div class="container tool-shell">
<a class="back" href="../index.html">← Kembali ke semua tools</a>
<div class="tool-head"><div class="eyebrow">DOCUMENT</div><h1>Merge PDF</h1>
<p>Gabungkan beberapa PDF menjadi satu file. Atur urutan file sebelum diproses.</p></div>
<div class="merge-box">
<input id="file" type="file" accept="application/pdf" multiple>
<div id="list" class="merge-list"></div>
<div class="iu-actions">
<button class="iu-btn alt" id="clear" disabled>Hapus Semua</button>
<button class="iu-btn" id="merge" disabled>Merge PDF</button>
</div>
<div class="iu-result" id="out">Pilih minimal 2 file PDF.</div>
</div></div></main>
<footer class="footer"><div class="container copyright">© 2026 Indonesia Utility Tools.</div></footer>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
const fileEl=document.getElementById('file'), listEl=document.getElementById('list'), out=document.getElementById('out');
const mergeBtn=document.getElementById('merge'), clearBtn=document.getElementById('clear');
let files=[];
function render(){
  listEl.innerHTML='';
  files.forEach((f,i)=>{
    const row=document.createElement('div'); row.className='merge-item';
    const name=document.createElement('div'); name.className='merge-name'; name.textContent=(i+1)+'. '+f.name;
    const actions=document.createElement('div'); actions.className='merge-actions';
    const up=document.createElement('button'); up.textContent='↑'; up.disabled=i===0; up.onclick=()=>{[files[i-1],files[i]]=[files[i],files[i-1]];render();};
    const down=document.createElement('button'); down.textContent='↓'; down.disabled=i===files.length-1; down.onclick=()=>{[files[i+1],files[i]]=[files[i],files[i+1]];render();};
    const del=document.createElement('button'); del.textContent='×'; del.onclick=()=>{files.splice(i,1);render();};
    actions.append(up,down,del); row.append(name,actions); listEl.appendChild(row);
  });
  mergeBtn.disabled=files.length<2; clearBtn.disabled=!files.length;
  if(files.length<2) out.textContent='Pilih minimal 2 file PDF.';
  else out.textContent=files.length+' file siap digabung.';
}
fileEl.addEventListener('change',()=>{
  const incoming=[...fileEl.files].filter(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));
  files.push(...incoming); fileEl.value=''; render();
});
clearBtn.onclick=()=>{files=[];render();};
mergeBtn.onclick=async()=>{
  mergeBtn.disabled=true; out.textContent='Memproses '+files.length+' PDF…';
  try{
    const merged=await PDFLib.PDFDocument.create();
    for(const f of files){
      const bytes=await f.arrayBuffer();
      let src;
      try{ src=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:false}); }
      catch(e){ throw new Error('PDF tidak dapat dibaca: '+f.name+'. Pastikan file tidak rusak atau terenkripsi.'); }
      const pages=await merged.copyPages(src,src.getPageIndices());
      pages.forEach(p=>merged.addPage(p));
    }
    const bytes=await merged.save({useObjectStreams:true});
    const blob=new Blob([bytes],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='merged-pdf.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    out.textContent='Selesai. '+files.length+' PDF berhasil digabung menjadi satu file.';
  }catch(e){
    out.textContent='Gagal: '+(e?.message||e);
  }finally{ mergeBtn.disabled=files.length<2; }
};
render();
</script>
</body></html>
