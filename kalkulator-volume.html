<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Hitung volume balok dari panjang, lebar, dan tinggi."><title>Kalkulator Volume — Indonesia Utility Tools</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html"><span class="brand-mark">IU</span><span>INDONESIA<br><b>UTILITY TOOLS</b></span></a><nav><a href="../index.html#categories">Kategori</a><a href="../index.html#popular">Populer</a></nav></div></header><main class="tool-page"><div class="container tool-shell"><a class="back" href="../index.html">← Kembali ke semua tools</a><div class="tool-head"><div class="eyebrow">INDONESIA UTILITY TOOLS</div><h1>Kalkulator Volume</h1><p>Hitung volume balok dari panjang, lebar, dan tinggi.</p></div>
<div class="calculator-card"><div class="row"><div class="field"><label>Panjang (m)</label><input id="p" type="number" step="any" placeholder="2"></div><div class="field"><label>Lebar (m)</label><input id="l" type="number" step="any" placeholder="1.5"></div></div><div class="field"><label>Tinggi (m)</label><input id="t" type="number" step="any" placeholder="1"></div><button class="calc-btn" onclick="calc()">Hitung Volume</button><div class="result"><div class="big" id="out">0 m³</div><div id="lit" class="note">0 liter</div></div></div>
<div class="tool-content"><h2>Rumus</h2><p>Volume balok = panjang × lebar × tinggi. 1 m³ = 1.000 liter.</p></div>
<script>function calc(){let a=+p.value||0,b=+l.value||0,c=+t.value||0,v=a*b*c;out.textContent=v.toLocaleString('id-ID',{maximumFractionDigits:4})+' m³';lit.textContent=(v*1000).toLocaleString('id-ID',{maximumFractionDigits:2})+' liter'}</script></div></main><footer class="footer"><div class="container copyright">© 2026 Indonesia Utility Tools.</div></footer></body></html>
