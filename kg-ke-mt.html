<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Konversi kilogram (kg) dan metric ton (MT) secara cepat."><title>KG ke MT Converter — Indonesia Utility Tools</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html"><span class="brand-mark">IU</span><span>INDONESIA<br><b>UTILITY TOOLS</b></span></a><nav><a href="../index.html#categories">Kategori</a><a href="../index.html#popular">Populer</a></nav></div></header><main class="tool-page"><div class="container tool-shell"><a class="back" href="../index.html">← Kembali ke semua tools</a><div class="tool-head"><div class="eyebrow">INDONESIA UTILITY TOOLS</div><h1>KG ↔ MT Converter</h1><p>Konversi kilogram (kg) dan metric ton (MT) secara cepat.</p></div>
<div class="calculator-card"><div class="field"><label>Masukkan Nilai</label><input id="value" type="number" step="any" placeholder="1000"></div><div class="field"><label>Arah Konversi</label><select id="mode"><option value="kgmt">KG → MT</option><option value="mtkg">MT → KG</option></select></div><button class="calc-btn" onclick="calc()">Konversi</button><div class="result"><div class="big" id="out">0</div></div></div>

<script>function calc(){let v=+value.value||0,m=mode.value,r=m==='kgmt'?v/1000:v*1000;out.textContent=r.toLocaleString('id-ID',{maximumFractionDigits:6})+(m==='kgmt'?' MT':' kg')}</script></div></main><footer class="footer"><div class="container copyright">© 2026 Indonesia Utility Tools.</div></footer></body></html>
