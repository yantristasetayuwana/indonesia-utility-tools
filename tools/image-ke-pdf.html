<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Buat PDF dari satu atau beberapa gambar."><title>Image → PDF — Indonesia Utility Tools</title><link rel="stylesheet" href="../assets/style.css"><style>.iu-box{background:#fff;border:1px solid #dbe3ea;border-radius:16px;padding:22px;box-shadow:0 7px 18px rgba(15,39,71,.045);margin-top:18px}textarea,input,select{width:100%;padding:11px;border:1px solid #ccd6e1;border-radius:9px;box-sizing:border-box}textarea{min-height:180px;resize:vertical}.iu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.iu-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.iu-btn{border:0;border-radius:9px;padding:11px 16px;background:#d8b45a;color:#16263a;font-weight:800;cursor:pointer}.iu-btn.alt{background:#e9eef3}.iu-result{margin-top:15px;padding:15px;background:#f4f7fa;border-radius:10px;white-space:pre-wrap;overflow:auto}@media(max-width:700px){.iu-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html"><span class="brand-mark">IU</span><span>INDONESIA<br><b>UTILITY TOOLS</b></span></a><nav><a href="../index.html#categories">Kategori</a><a href="../index.html#popular">Populer</a></nav></div></header><main class="tool-page"><div class="container tool-shell"><a class="back" href="../index.html">← Kembali ke semua tools</a><div class="tool-head"><div class="eyebrow">INDONESIA UTILITY TOOLS</div><h1>Image → PDF</h1><p>Buat PDF dari satu atau beberapa gambar.</p></div><div class="iu-box"><input id="file" type="file" accept="image/*" multiple><div class="iu-grid" style="margin-top:12px"><div><label>Lebar (px, opsional)</label><input id="w" type="number"></div><div><label>Kualitas 0.1–1</label><input id="q" type="number" min="0.1" max="1" step="0.05" value="0.8"></div></div><div class="iu-actions"><button class="iu-btn" onclick="go()">Proses</button></div><div class="iu-result" id="out">Pilih gambar.</div></div><script>async function go(){let fs=[...file.files];if(!fs.length)return;let js=document.createElement("script");js.src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";js.onload=async()=>{let {jsPDF}=window.jspdf,p=new jsPDF();for(let i=0;i<fs.length;i++){let im=await load(fs[i]);let r=Math.min(180/im.w,270/im.h),w=im.w*r,h=im.h*r;if(i)p.addPage();p.addImage(im.url,"JPEG",15,15,w,h)}p.save("images.pdf");out.textContent="PDF selesai."};document.body.appendChild(js)}function load(f){return new Promise(r=>{let u=URL.createObjectURL(f),im=new Image();im.onload=()=>r({url:u,w:im.width,h:im.height});im.src=u})}</script></div></main><footer class="footer"><div class="container copyright">© 2026 Indonesia Utility Tools.</div></footer></body></html>
