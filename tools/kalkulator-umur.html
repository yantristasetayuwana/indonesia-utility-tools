<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Hitung usia berdasarkan tanggal lahir sampai tanggal hari ini."><title>Kalkulator Umur — Indonesia Utility Tools</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html"><span class="brand-mark">IU</span><span>INDONESIA<br><b>UTILITY TOOLS</b></span></a><nav><a href="../index.html#categories">Kategori</a><a href="../index.html#popular">Populer</a></nav></div></header><main class="tool-page"><div class="container tool-shell"><a class="back" href="../index.html">← Kembali ke semua tools</a><div class="tool-head"><div class="eyebrow">INDONESIA UTILITY TOOLS</div><h1>Kalkulator Umur</h1><p>Hitung usia berdasarkan tanggal lahir sampai tanggal hari ini.</p></div>
<div class="calculator-card"><div class="field"><label>Tanggal Lahir</label><input id="dob" type="date"></div><button class="calc-btn" onclick="calc()">Hitung Umur</button><div class="result"><div class="big" id="out">—</div><div id="days" class="note"></div></div></div>
<div class="tool-content"><h2>Catatan</h2><p>Hasil dihitung berdasarkan kalender dan tanggal hari ini di perangkat Anda.</p></div>
<script>function calc(){let d=new Date(dob.value+'T00:00:00'),n=new Date();if(!dob.value||isNaN(d)){out.textContent='Masukkan tanggal';return}let y=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth(),day=n.getDate()-d.getDate();if(day<0){m--;day+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}out.textContent=y+' tahun '+m+' bulan '+day+' hari';days.textContent='Tanggal hari ini: '+n.toLocaleDateString('id-ID')}</script></div></main><footer class="footer"><div class="container copyright">© 2026 Indonesia Utility Tools.</div></footer></body></html>
