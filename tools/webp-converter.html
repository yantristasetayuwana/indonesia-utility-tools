="iu-btn" onclick="go()">Proses</button></div><div class="iu-result" id="out">Pilih gambar.</div></div><script>async function go(){let f=document.getElementById("file").files[0];if(!f)return;let im=await load(f),canvas=document.createElement("canvas"),w=+document.getElementById("w").value||im.width,h=Math.round(im.height*w/im.width);if("webp"==="imgcompress"||"webp"==="imgconvert"||"webp"==="webp"){{w=im.width;h=im.height}}canvas.width=w;canvas.height=h;let x=canvas.getContext("2d");x.drawImage(im.img,0,0,w,h);let type="image/webp";canvas.toBlob(b=>{let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hasil.webp";a.click();out.textContent="File selesai diproses."},type,Math.min(1,Math.max(.1,+document.getElementById("q").value||.8)))}function load(f){return new Promise(r=>{let im=new Image();im.onload=()=>r({img:im,width:im.width,height:im.height});im.src=URL.createObjectURL(f)})}</script></div></main><footer class="footer"><div class="container copyright">© 2026 Indonesia Utility Tools.</div></footer></body></html>
